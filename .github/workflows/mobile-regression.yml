name: Mobile regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: Serve preview
        run: |
          bunx vite preview --port 8080 --strictPort &
          for i in {1..30}; do
            curl -sSf http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - name: Mobile audit (360 / 375 / 640 / 768)
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/mobile-audit.mjs --widths=360,375,640,768
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit
          path: mobile-audit/
          retention-days: 14